<!-- @dsCard group="Foundations" -->
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #20242f;
    --border: #2a2d3a;
    --primary: #6366f1;
    --primary-hover: #4f52d6;
    --text: #e2e8f0;
    --muted: #64748b;
    --st-backlog: #475569;
    --st-in-dev: #3b82f6;
    --st-review: #f59e0b;
    --st-done: #10b981;
    --pr-low: #64748b;
    --pr-medium: #6366f1;
    --pr-high: #ef4444;
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    padding: 24px;
    line-height: 1.5;
  }
  .spec-title {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-start;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .label {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--font-mono);
  }
  .card {
    position: relative;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 12px;
    transition: border-color 0.15s;
    width: 248px;
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--primary) 50%, transparent);
  }
  .card-ref {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }
  .card-title {
    margin-top: 4px;
    padding-right: 16px;
    font-size: 14px;
    font-weight: 500;
  }
  .chips {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    border-radius: 4px;
    border: 1px solid;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 500;
  }
  .prio {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }
  .dot {
    height: 8px;
    width: 8px;
    border-radius: 9999px;
    display: inline-block;
    flex: none;
  }
  .bolt {
    position: absolute;
    right: 8px;
    top: 8px;
    color: var(--primary);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 500;
    border: 0;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover {
    background: var(--primary-hover);
  }
  .select {
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 6px 12px;
    font-size: 14px;
    outline: none;
  }
  .select:focus {
    border-color: var(--primary);
  }
</style>
<div class="spec-title">Spacing, radius &amp; touch targets</div>
<div class="stack">
  <div>
    <div class="label">Radius scale</div>
    <div class="row" style="margin-top: 8px">
      <div>
        <div
          style="
            width: 72px;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
          "
        ></div>
        <div class="label" style="margin-top: 6px">4px chips</div>
      </div>
      <div>
        <div
          style="
            width: 72px;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
          "
        ></div>
        <div class="label" style="margin-top: 6px">6px nav</div>
      </div>
      <div>
        <div
          style="
            width: 72px;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
          "
        ></div>
        <div class="label" style="margin-top: 6px">8px cards/btn</div>
      </div>
      <div>
        <div
          style="
            width: 44px;
            height: 44px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 9999px;
          "
        ></div>
        <div class="label" style="margin-top: 6px">full dots</div>
      </div>
    </div>
  </div>
  <div>
    <div class="label">Spacing rhythm — 4px base</div>
    <div class="row" style="margin-top: 8px; align-items: flex-end">
      <div>
        <div style="width: 4px; height: 24px; background: var(--primary)"></div>
        <div class="label">4</div>
      </div>
      <div>
        <div style="width: 8px; height: 24px; background: var(--primary)"></div>
        <div class="label">8</div>
      </div>
      <div>
        <div style="width: 12px; height: 24px; background: var(--primary)"></div>
        <div class="label">12</div>
      </div>
      <div>
        <div style="width: 16px; height: 24px; background: var(--primary)"></div>
        <div class="label">16</div>
      </div>
      <div>
        <div style="width: 20px; height: 24px; background: var(--primary)"></div>
        <div class="label">20</div>
      </div>
    </div>
  </div>
  <div>
    <div class="label">Touch targets — coarse pointer only</div>
    <div class="row" style="margin-top: 8px">
      <div
        style="
          width: 150px;
          height: 44px;
          border: 1px dashed var(--primary);
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
        "
      >
        .tap-target 44px
      </div>
      <div
        style="
          width: 150px;
          height: 36px;
          border: 1px dashed var(--primary);
          border-radius: 8px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 12px;
        "
      >
        .tap-target-sm 36px
      </div>
    </div>
    <div class="label" style="margin-top: 8px">
      Plus iOS safe-area insets on .app-header / .board-bar / .board-scroll (PWA,
      viewport-fit=cover).
    </div>
  </div>
</div>
