<!-- @dsCard group="Components" -->
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface-hover: #20242f;
    --border: #2a2d3a;
    --primary: #6366f1;
    --primary-hover: #4f52d6;
    --text: #e2e8f0;
    --muted: #64748b;
    --st-backlog: #475569;
    --st-in-dev: #3b82f6;
    --st-review: #f59e0b;
    --st-done: #10b981;
    --pr-low: #64748b;
    --pr-medium: #6366f1;
    --pr-high: #ef4444;
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    padding: 24px;
    line-height: 1.5;
  }
  .spec-title {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-start;
  }
  .stack {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .label {
    font-size: 11px;
    color: var(--muted);
    font-family: var(--font-mono);
  }
  .card {
    position: relative;
    cursor: pointer;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    padding: 12px;
    transition: border-color 0.15s;
    width: 248px;
  }
  .card:hover {
    border-color: color-mix(in srgb, var(--primary) 50%, transparent);
  }
  .card-ref {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }
  .card-title {
    margin-top: 4px;
    padding-right: 16px;
    font-size: 14px;
    font-weight: 500;
  }
  .chips {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .chip {
    display: inline-flex;
    align-items: center;
    border-radius: 4px;
    border: 1px solid;
    padding: 2px 6px;
    font-size: 11px;
    font-weight: 500;
  }
  .prio {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }
  .dot {
    height: 8px;
    width: 8px;
    border-radius: 9999px;
    display: inline-block;
    flex: none;
  }
  .bolt {
    position: absolute;
    right: 8px;
    top: 8px;
    color: var(--primary);
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    background: var(--primary);
    color: #fff;
    padding: 6px 12px;
    font-size: 14px;
    font-weight: 500;
    border: 0;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover {
    background: var(--primary-hover);
  }
  .select {
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 6px 12px;
    font-size: 14px;
    outline: none;
  }
  .select:focus {
    border-color: var(--primary);
  }
</style>
<div class="spec-title">TagChip &amp; PriorityBadge</div>
<div class="stack">
  <div>
    <div class="label">TagChip — colour derived from the tag hex: bg 10% (1a), border 20% (33)</div>
    <div class="row" style="margin-top: 8px">
      <span class="chip" style="background: #10b9811a; color: #10b981; border-color: #10b98133"
        >feature</span
      >
      <span class="chip" style="background: #ef44441a; color: #ef4444; border-color: #ef444433"
        >bug</span
      >
      <span class="chip" style="background: #64748b1a; color: #64748b; border-color: #64748b33"
        >chore</span
      >
      <span class="chip" style="background: #3b82f61a; color: #3b82f6; border-color: #3b82f633"
        >improvement</span
      >
      <span class="chip" style="background: #f59e0b1a; color: #f59e0b; border-color: #f59e0b33"
        >research</span
      >
      <span class="chip" style="background: #6366f11a; color: #6366f1; border-color: #6366f133"
        >urgent</span
      >
    </div>
  </div>
  <div>
    <div class="label">PriorityBadge — 8px dot + label, 11px muted text</div>
    <div class="row" style="margin-top: 8px">
      <span class="prio" style="margin-top: 0"
        ><span class="dot" style="background: #64748b"></span>Low</span
      >
      <span class="prio" style="margin-top: 0"
        ><span class="dot" style="background: #6366f1"></span>Medium</span
      >
      <span class="prio" style="margin-top: 0"
        ><span class="dot" style="background: #ef4444"></span>High</span
      >
    </div>
  </div>
</div>
