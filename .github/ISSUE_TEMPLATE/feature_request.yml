name: Feature request
description: Suggest an idea or improvement
labels: ['feature']
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that Forge makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to see?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Anything you've tried instead?
      description: Workarounds, other tools, or approaches you considered.

  - type: checkboxes
    id: contribute
    attributes:
      label: Would you be up for building it?
      description: Entirely optional — asking doesn't commit you to anything.
      options:
        - label: I'd be interested in opening a PR for this
